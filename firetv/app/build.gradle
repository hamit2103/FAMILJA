plugins {
    id "com.android.application"
}

android {
    namespace "com.pajaziti.familja"
    compileSdk 35

    signingConfigs {
        pajazitiRelease {
            storeFile file("../pajaziti-release.jks")
            storePassword "pajaziti2026"
            keyAlias "pajaziti"
            keyPassword "pajaziti2026"
        }
    }

    defaultConfig {
        applicationId "com.pajaziti.familja"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "2.2"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pajazitiRelease
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pajazitiRelease
        }
    }
}
