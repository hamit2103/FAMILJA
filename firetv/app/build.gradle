plugins {
    id "com.android.application"
}

def adminBuild = project.hasProperty("adminBuild") && project.property("adminBuild").toString().toBoolean()
def asyaBuild = project.hasProperty("asyaBuild") && project.property("asyaBuild").toString().toBoolean()
def requestedLabel = project.findProperty("appLabel") ?: (adminBuild ? "DIAMOND ADMIN" : (asyaBuild ? "ASYA" : "DIAMOND"))
def requestedVersionName = project.findProperty("versionName") ?: (asyaBuild ? "0.1.0" : "5.23")
def requestedVersionCode = (project.findProperty("versionCode") ?: (asyaBuild ? "1" : "55")).toString().toInteger()

android {
    namespace "com.pajaziti.familja"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        pajazitiRelease {
            storeFile file("../pajaziti-release.jks")
            storePassword file("../.store-password").exists() ? file("../.store-password").text.trim() : (System.getenv("ANGEL_KEYSTORE_PASSWORD") ?: "")
            keyAlias file("../.key-alias").exists() ? file("../.key-alias").text.trim() : (System.getenv("ANGEL_KEY_ALIAS") ?: "pajaziti")
            keyPassword file("../.key-password").exists() ? file("../.key-password").text.trim() : (System.getenv("ANGEL_KEY_PASSWORD") ?: "")
        }
    }

    defaultConfig {
        applicationId project.findProperty("appId") ?: "com.pajaziti.familja"
        minSdk 23
        targetSdk 35
        versionCode requestedVersionCode
        versionName requestedVersionName
        buildConfigField "boolean", "ADMIN_BUILD", adminBuild ? "true" : "false"
        manifestPlaceholders = [appLabel: requestedLabel]
    }

    buildTypes {
        debug {
            if (!adminBuild && !asyaBuild) {
                signingConfig signingConfigs.pajazitiRelease
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pajazitiRelease
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
