plugins {
    id "com.android.application"
}

android {
    namespace "com.pajaziti.familja"
    compileSdk 35

    signingConfigs {
        pajazitiRelease {
            storeFile file("../pajaziti-release.jks")
            storePassword System.getenv("ANGEL_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("ANGEL_KEY_ALIAS") ?: "pajaziti"
            keyPassword System.getenv("ANGEL_KEY_PASSWORD") ?: ""
        }
    }

    defaultConfig {
        applicationId project.findProperty("appId") ?: "com.pajaziti.familja"
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName "5.3"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pajazitiRelease
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pajazitiRelease
        }
    }
}


dependencies {
    implementation "androidx.core:core:1.13.1"
}
