plugins {
    id "com.android.application"
}

android {
    namespace "com.pajaziti.familja"
    compileSdk 35

    signingConfigs {
        pajazitiRelease {
            storeFile file("../pajaziti-release.jks")
            storePassword file("../.store-password").exists() ? file("../.store-password").text.trim() : (System.getenv("ANGEL_KEYSTORE_PASSWORD") ?: "")
            keyAlias file("../.key-alias").exists() ? file("../.key-alias").text.trim() : (System.getenv("ANGEL_KEY_ALIAS") ?: "pajaziti")
            keyPassword file("../.key-password").exists() ? file("../.key-password").text.trim() : (System.getenv("ANGEL_KEY_PASSWORD") ?: "")
        }
    }

    defaultConfig {
        applicationId project.findProperty("appId") ?: "com.pajaziti.familja"
        minSdk 23
        targetSdk 35
        versionCode 38
        versionName "5.6"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pajazitiRelease
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pajazitiRelease
        }
    }
}


dependencies {
    implementation "androidx.core:core:1.13.1"
}
