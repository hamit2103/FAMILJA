<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIAMOND-TV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#111114;border-bottom:1px solid #27272f}.brand{font-weight:800}.brand b{color:#e11d2e}button,a{background:#e11d2e;color:#fff;border:0;border-radius:10px;padding:10px 13px;text-decoration:none;font-weight:700}.player{position:relative;background:#000;aspect-ratio:16/9}.player video{width:100%;height:100%;object-fit:contain}.live{position:absolute;left:12px;top:12px;background:#d90429;padding:6px 8px;border-radius:6px;font-weight:800}.bug{position:absolute;right:12px;top:12px;background:#0009;padding:6px 8px;border-radius:6px}.card{margin:14px;padding:15px;background:#15151a;border:1px solid #2a2a31;border-radius:14px}.row{display:flex;justify-content:space-between;gap:16px}.muted{font-size:12px;color:#aaa;font-weight:700}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #292932}.item:last-child{border:0}input{width:100%;padding:11px;margin:6px 0;background:#0d0d11;color:#fff;border:1px solid #35353f;border-radius:9px}.hidden{display:none}.ok{color:#57d676}.err{color:#ff6b6b}.small{font-size:12px;color:#aaa}@media(max-width:600px){.row{display:block}.row>div+div{margin-top:12px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>◆</b> DIAMOND-TV</div><button id="fs">⛶ Fullscreen</button></header>
<section class="player"><video id="v" controls playsinline preload="metadata"></video><div class="live">● LIVE</div><div class="bug">◆ DIAMOND-TV</div></section>

<section class="card row"><div><div class="muted">TANI NË TRANSMETIM</div><h2 id="now">Po ngarkohet…</h2></div><div><div class="muted">MË PAS</div><div id="next">—</div></div></section>
<div class="controls"><button id="reload">↻ Rifresko</button><a id="m3u" download="DIAMOND-TV.m3u">M3U</a></div>

<section class="card"><h3>Programi 24/7</h3><div id="list"></div></section>

<section class="card">
<h3>Admin</h3>
<div id="loginBox">
<input id="email" type="email" value="admin@familja.local" placeholder="Email admin">
<input id="password" type="password" placeholder="Password">
<button id="login">Hyr si Admin</button>
<div id="loginMsg" class="small"></div>
</div>

<div id="adminBox" class="hidden">
<div class="small">Mund të zgjedhësh video direkt nga telefoni. Maksimumi 50 MB për një video në planin falas.</div>
<input id="file" type="file" accept="video/mp4,video/webm,video/quicktime,video/*">
<input id="title" placeholder="Titulli i videos">
<input id="dur" type="number" min="1" placeholder="Kohëzgjatja në sekonda">
<button id="upload">Ngarko videon nga telefoni</button>
<button id="logout">Dil nga Admini</button>
<div id="uploadMsg" class="small"></div>
</div>
</section>

<script>
const SUPABASE_URL="https://htuzevfjmctmjnqrdrrq.supabase.co";
const SUPABASE_KEY="sb_publishable_103MOyFUNJ097_HbthW21Q_wDTi-dYH";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const video=document.getElementById("v"), now=document.getElementById("now"), next=document.getElementById("next"), list=document.getElementById("list");
let playlist={channel_name:"DIAMOND-TV",epoch:new Date().toISOString(),videos:[]}, current="";

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function enabled(){return (playlist.videos||[]).filter(x=>x.enabled!==false && x.url)}
function slot(items){
  const total=items.reduce((s,x)=>s+Number(x.duration_seconds||0),0);
  if(!items.length||!total)return null;
  let p=Math.floor((Date.now()-Date.parse(playlist.epoch||new Date().toISOString()))/1000)%total;
  if(p<0)p+=total;
  let a=0;
  for(let i=0;i<items.length;i++){const d=Number(items[i].duration_seconds||0);if(p<a+d)return{i,item:items[i],offset:p-a};a+=d}
  return{i:0,item:items[0],offset:0}
}
function render(){
  const items=enabled();
  list.innerHTML="";
  if(!items.length){list.innerHTML='<div class="small">Ende nuk ka video në program.</div>';now.textContent="Nuk ka video";next.textContent="—";return}
  items.forEach((x,i)=>{const d=document.createElement("div");d.className="item";d.innerHTML="<span>"+(i+1)+". "+esc(x.title)+"</span><span>"+Number(x.duration_seconds||0)+"s</span>";list.appendChild(d)});
  const m3u="#EXTM3U\n"+items.map(x=>"#EXTINF:"+Number(x.duration_seconds||-1)+","+x.title+"\n"+x.url).join("\n")+"\n";
  document.getElementById("m3u").href=URL.createObjectURL(new Blob([m3u],{type:"audio/x-mpegurl"}));
}
function sync(force=false){
  const items=enabled(),s=slot(items);if(!s)return;
  now.textContent=s.item.title;next.textContent=items[(s.i+1)%items.length]?.title||"—";
  if(force||current!==s.item.id){
    current=s.item.id;video.src=s.item.url;
    video.addEventListener("loadedmetadata",function seek(){try{video.currentTime=Math.min(s.offset,Math.max(0,(video.duration||s.offset)-.2))}catch{};video.play().catch(()=>{});video.removeEventListener("loadedmetadata",seek)});
    video.load();
  }
}
async function loadPlaylist(){
  const {data,error}=await sb.from("app_settings").select("value").eq("key","diamond_tv_playlist").maybeSingle();
  if(error){now.textContent="Gabim në playlist";return}
  playlist=data?.value||{channel_name:"DIAMOND-TV",epoch:new Date().toISOString(),videos:[]};
  if(!Array.isArray(playlist.videos))playlist.videos=[];
  render();sync(true);
}
async function savePlaylist(){
  const {data:{user}}=await sb.auth.getUser();
  const {error}=await sb.from("app_settings").upsert({
    key:"diamond_tv_playlist",
    value:playlist,
    updated_at:new Date().toISOString(),
    updated_by:user?.id||null
  },{onConflict:"key"});
  if(error)throw error;
}
async function updateAuth(){
  const {data:{session}}=await sb.auth.getSession();
  const admin=session?.user?.email?.toLowerCase()==="admin@familja.local";
  document.getElementById("loginBox").classList.toggle("hidden",admin);
  document.getElementById("adminBox").classList.toggle("hidden",!admin);
}
document.getElementById("login").onclick=async()=>{
  const msg=document.getElementById("loginMsg");msg.textContent="Po hyn…";
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){msg.className="small err";msg.textContent="Login gabim: "+error.message;return}
  if(data.user?.email?.toLowerCase()!=="admin@familja.local"){await sb.auth.signOut();msg.className="small err";msg.textContent="Ky nuk është admin.";return}
  msg.textContent="";await updateAuth();
};
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();await updateAuth()};
document.getElementById("upload").onclick=async()=>{
  const msg=document.getElementById("uploadMsg"),file=document.getElementById("file").files?.[0];
  const title=document.getElementById("title").value.trim()||file?.name||"Video";
  const dur=Number(document.getElementById("dur").value);
  if(!file){msg.className="small err";msg.textContent="Zgjidh një video nga telefoni.";return}
  if(file.size>50*1024*1024){msg.className="small err";msg.textContent="Videoja është mbi 50 MB.";return}
  if(!dur||dur<1){msg.className="small err";msg.textContent="Shkruaj kohëzgjatjen në sekonda.";return}
  msg.className="small";msg.textContent="Po ngarkohet videoja…";
  const ext=(file.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4";
  const path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  const {error:upErr}=await sb.storage.from("diamond-tv-videos").upload(path,file,{contentType:file.type||"video/mp4",upsert:false});
  if(upErr){msg.className="small err";msg.textContent="Upload gabim: "+upErr.message;return}
  const {data:pub}=sb.storage.from("diamond-tv-videos").getPublicUrl(path);
  playlist.videos.push({id:"v"+Date.now(),title,url:pub.publicUrl,storage_path:path,duration_seconds:dur,enabled:true});
  if(playlist.videos.length===1)playlist.epoch=new Date().toISOString();
  try{await savePlaylist();msg.className="small ok";msg.textContent="Videoja u shtua në DIAMOND-TV.";document.getElementById("file").value="";document.getElementById("title").value="";document.getElementById("dur").value="";render();sync(true)}
  catch(e){msg.className="small err";msg.textContent="Gabim në ruajtjen e programit: "+e.message}
};
document.getElementById("fs").onclick=()=>video.requestFullscreen?.();
document.getElementById("reload").onclick=()=>loadPlaylist();
video.onclick=()=>video.requestFullscreen?.();
sb.auth.onAuthStateChange(()=>updateAuth());
updateAuth();loadPlaylist();setInterval(()=>sync(false),3000);
</script>
</body>
</html>
