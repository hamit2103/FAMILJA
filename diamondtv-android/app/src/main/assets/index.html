<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DIAMOND-TV</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#111114;border-bottom:1px solid #27272f}.brand{font-weight:800}.brand b{color:#e11d2e}button,a{background:#e11d2e;color:#fff;border:0;border-radius:10px;padding:10px 13px;text-decoration:none;font-weight:700}.player{position:relative;background:#000;aspect-ratio:16/9}.player video{width:100%;height:100%;object-fit:contain}.live{position:absolute;left:12px;top:12px;background:#d90429;padding:6px 8px;border-radius:6px;font-weight:800}.bug{position:absolute;right:12px;top:12px;background:#0009;padding:6px 8px;border-radius:6px}.card{margin:14px;padding:15px;background:#15151a;border:1px solid #2a2a31;border-radius:14px}.row{display:flex;justify-content:space-between;gap:16px}.muted{font-size:12px;color:#aaa;font-weight:700}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #292932}.item:last-child{border:0}input{width:100%;padding:11px;margin:6px 0;background:#0d0d11;color:#fff;border:1px solid #35353f;border-radius:9px}@media(max-width:600px){.row{display:block}.row>div+div{margin-top:12px}}</style></head><body><header class="top"><div class="brand"><b>◆</b> DIAMOND-TV</div><button id="fs">⛶ Fullscreen</button></header><section class="player"><video id="v" controls playsinline preload="metadata"></video><div class="live">● LIVE</div><div class="bug">◆ DIAMOND-TV</div></section><section class="card row"><div><div class="muted">TANI NË TRANSMETIM</div><h2 id="now">DIAMOND-TV Demo</h2></div><div><div class="muted">MË PAS</div><div id="next">DIAMOND-TV Demo</div></div></section><div class="controls"><button id="reload">↻ Rifresko</button><a id="m3u" download="diamond-tv.m3u">M3U</a></div><section class="card"><h3>Programi 24/7</h3><div id="list"></div></section><section class="card"><h3>Admin – provë në këtë pajisje</h3><p>Shto URL publike MP4/WebM.</p><input id="title" placeholder="Titulli"><input id="url" placeholder="https://...video.mp4"><input id="dur" type="number" min="1" placeholder="Kohëzgjatja në sekonda"><button id="add">Shto video</button> <button id="reset">Pastro provën</button></section><script>
const base=[{id:"demo",title:"DIAMOND-TV Demo",url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",duration:30}];
const get=()=>{try{return JSON.parse(localStorage.getItem("diamondTvList"))||base}catch{return base}};
const set=x=>localStorage.setItem("diamondTvList",JSON.stringify(x));
const video=document.getElementById("v"),now=document.getElementById("now"),next=document.getElementById("next"),list=document.getElementById("list");let current="";
function slot(items){const total=items.reduce((s,x)=>s+Number(x.duration||0),0);if(!items.length||!total)return null;let p=Math.floor(Date.now()/1000)%total,a=0;for(let i=0;i<items.length;i++){const d=Number(items[i].duration||0);if(p<a+d)return{i,item:items[i],offset:p-a};a+=d}return{i:0,item:items[0],offset:0}}
function render(){const items=get();list.innerHTML="";items.forEach((x,i)=>{const d=document.createElement("div");d.className="item";d.innerHTML="<span>"+(i+1)+". "+x.title+"</span><span>"+x.duration+"s</span>";list.appendChild(d)});const m3u="#EXTM3U\n"+items.map(x=>"#EXTINF:"+x.duration+","+x.title+"\n"+x.url).join("\n")+"\n";document.getElementById("m3u").href=URL.createObjectURL(new Blob([m3u],{type:"audio/x-mpegurl"}))}
function sync(force=false){const items=get(),s=slot(items);if(!s)return;now.textContent=s.item.title;next.textContent=items[(s.i+1)%items.length].title;if(force||current!==s.item.id){current=s.item.id;video.src=s.item.url;video.addEventListener("loadedmetadata",function seek(){video.currentTime=Math.min(s.offset,Math.max(0,(video.duration||s.offset)-.2));video.play().catch(()=>{});video.removeEventListener("loadedmetadata",seek)});video.load()}}
document.getElementById("fs").onclick=()=>video.requestFullscreen?.();document.getElementById("reload").onclick=()=>{render();sync(true)};document.getElementById("add").onclick=()=>{const t=document.getElementById("title").value.trim(),u=document.getElementById("url").value.trim(),d=Number(document.getElementById("dur").value);if(!t||!u||!d)return alert("Plotëso titullin, URL dhe kohëzgjatjen.");const items=get();items.push({id:String(Date.now()),title:t,url:u,duration:d});set(items);render();sync(true)};document.getElementById("reset").onclick=()=>{localStorage.removeItem("diamondTvList");render();sync(true)};video.onclick=()=>video.requestFullscreen?.();render();sync(true);setInterval(()=>sync(false),3000);
</script></body></html>
