name: Build DIAMOND-TV APK

on:
  push:
    branches: [ main ]
    paths:
      - 'diamondtv-android/**'
      - '.github/workflows/build-diamond-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: diamondtv-android
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK
        run: cp diamondtv-android/app/build/outputs/apk/debug/app-debug.apk DIAMOND-TV.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIAMOND-TV
          path: DIAMOND-TV.apk

      - name: Publish APK to repo
        run: |
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add -f DIAMOND-TV.apk
          git diff --cached --quiet || git commit -m "Publish DIAMOND-TV APK [skip ci]"
          git push
