name: Build ANGEL APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "*.apk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angel-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        working-directory: firetv
        run: |
          base64 -d pajaziti-release.jks.b64 > pajaziti-release.jks
          test -s pajaziti-release.jks

      - name: Build signed release APK
        run: gradle -p firetv :app:assembleRelease --no-daemon

      - name: Publish APK files
        run: |
          APK="firetv/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" pajaziti-android.apk
          cp "$APK" pajaziti-firetv.apk
          cp "$APK" pajaziti-fresh.apk

      - name: Upload ANGEL 4.5 to update server
        run: |
          curl --fail --show-error --silent \
            -H "x-angel-build-token: angel-build-4-5-20260921" \
            --data-binary @pajaziti-android.apk \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-apk-upload?name=ANGEL-4.5.apk"
          curl --fail --show-error --silent \
            -H "x-angel-build-token: angel-build-4-5-20260921" \
            --data-binary @pajaziti-fresh.apk \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-apk-upload?name=ANGEL-4.5-fresh.apk"

      - name: Commit APK update
        run: |
          git config user.name "ANGEL Build"
          git config user.email "actions@users.noreply.github.com"
          git add pajaziti-android.apk pajaziti-firetv.apk pajaziti-fresh.apk
          if git diff --cached --quiet; then
            echo "APK already up to date."
          else
            git commit -m "Publish ANGEL 4.5 APK [skip ci]"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANGEL-4.5
          path: firetv/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
