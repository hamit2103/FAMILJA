name: Build Diamond APK
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "*.apk"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: diamond-apk-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=angel-build")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Restore signing keystore securely
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          SECRET_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-build-secret")"
          python3 -c 'import json,os,pathlib,sys,base64; d=json.load(sys.stdin); pathlib.Path("firetv/pajaziti-release.jks").write_bytes(base64.b64decode(d["keystore_b64"])); pathlib.Path("firetv/.store-password").write_text(d["store_password"],encoding="utf-8"); pathlib.Path("firetv/.key-alias").write_text(d["key_alias"],encoding="utf-8"); pathlib.Path("firetv/.key-password").write_text(d["key_password"],encoding="utf-8"); f=open(os.environ["GITHUB_ENV"],"a",encoding="utf-8"); f.write("ANGEL_KEYSTORE_PASSWORD="+d["store_password"]+"\\nANGEL_KEY_ALIAS="+d["key_alias"]+"\\nANGEL_KEY_PASSWORD="+d["key_password"]+"\\n"); f.close()' <<<"$SECRET_JSON"
          test -s firetv/pajaziti-release.jks
      - name: Sync current Android web assets
        run: |
          cp index.html admin.html styles.css app.js app-config.js games.js sports.js tv.js radio.js manifest.webmanifest admin-manifest.webmanifest icon.svg angel-icon.jpg sw.js war.js kosovo-free-https.m3u rtk-free.m3u diet.js ki.js prayer-guide.js quran.js ruqya.js prayer-extras.js share-app.js news.js diamond-intro.mp4 firetv/app/src/main/assets/

      - name: Build signed release APKs
        run: |
          gradle -p firetv :app:assembleRelease --no-daemon
          cp firetv/app/build/outputs/apk/release/app-release.apk pajaziti-android.apk
          cp pajaziti-android.apk pajaziti-firetv.apk
          gradle -p firetv clean :app:assembleRelease -PappId=com.pajaziti.familja.fresh --no-daemon
          cp firetv/app/build/outputs/apk/release/app-release.apk pajaziti-fresh.apk
      - name: Build signed Admin APK
        run: |
          gradle -p firetv clean :app:assembleRelease -PappId=com.pajaziti.familja.admin -PadminBuild=true --no-daemon
          cp firetv/app/build/outputs/apk/release/app-release.apk DIAMOND-ADMIN.apk

      - name: Verify APK files
        run: |
          test -s pajaziti-android.apk
          test -s pajaziti-firetv.apk
          test -s pajaziti-fresh.apk
          test -s DIAMOND-ADMIN.apk
      - name: Commit APK update
        continue-on-error: true
        run: |
          git config user.name "Diamond Build"
          git config user.email "actions@users.noreply.github.com"
          git add pajaziti-android.apk pajaziti-firetv.apk pajaziti-fresh.apk DIAMOND-ADMIN.apk
          if git diff --cached --quiet; then
            echo "APK already up to date."
          else
            git commit -m "Publish Diamond 5.73 APK [skip ci]"
            git fetch origin main
            git push || true
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-5.73
          path: pajaziti-android.apk
          if-no-files-found: error

      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIAMOND-ADMIN
          path: DIAMOND-ADMIN.apk
          if-no-files-found: error
      - name: Upload Diamond 5.73 to update server
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --max-time 180 --fail --show-error --silent \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data-binary @pajaziti-android.apk \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-apk-upload?name=Diamond-5.73.apk"
          curl --max-time 180 --fail --show-error --silent \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data-binary @pajaziti-fresh.apk \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-apk-upload?name=Diamond-5.73-fresh.apk"
          curl --max-time 180 --fail --show-error --silent \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data-binary @DIAMOND-ADMIN.apk \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-apk-upload?name=DIAMOND-ADMIN.apk"

