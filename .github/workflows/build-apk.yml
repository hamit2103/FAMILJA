name: Build Familja APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate project archive
        shell: bash
        run: |
          cat source/Familja-Android.zip.b64.part1               source/Familja-Android.zip.b64.part2               source/Familja-Android.zip.b64.part3               source/Familja-Android.zip.b64.part4               | base64 --decode > Familja-Android.zip
          unzip -q Familja-Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: Familja
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Familja-debug-apk
          path: Familja/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
