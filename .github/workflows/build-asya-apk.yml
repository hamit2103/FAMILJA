name: Build ASYA APK

on:
  push:
    branches: [ asya-build ]
  pull_request:
    branches: [ main ]
    paths:
      - "asya/**"
      - "firetv/**"
      - ".github/workflows/build-asya-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-asya-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ASYA branch
        uses: actions/checkout@v4
        with:
          ref: asya-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare ASYA assets
        run: |
          rm -rf firetv/app/src/main/assets
          mkdir -p firetv/app/src/main/assets
          cp asya/index.html asya/styles.css asya/app.js firetv/app/src/main/assets/

      - name: Build ASYA debug APK
        run: |
          gradle -p firetv clean :app:assembleDebug --no-daemon \
            -PasyaBuild=true \
            -PappId=com.asya.mobile \
            -PappLabel=ASYA \
            -PversionName=0.1.0 \
            -PversionCode=1
          cp firetv/app/build/outputs/apk/debug/app-debug.apk /tmp/ASYA-v0.1.0.apk
          test -s /tmp/ASYA-v0.1.0.apk

      - name: Publish APK on ASYA branch
        run: |
          cp /tmp/ASYA-v0.1.0.apk ASYA-v0.1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASYA-v0.1.0.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish ASYA v0.1.0 APK [skip ci]"
            git push origin asya-build
          fi

      - name: Upload ASYA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASYA-v0.1.0
          path: /tmp/ASYA-v0.1.0.apk
