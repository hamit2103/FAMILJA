name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "firetv/**"
      - ".github/workflows/build-firetv.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-android-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=angel-build")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore securely
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          SECRET_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://htuzevfjmctmjnqrdrrq.supabase.co/functions/v1/angel-build-secret")"
          python3 -c 'import json,os,pathlib,sys,base64; d=json.load(sys.stdin); pathlib.Path("firetv/pajaziti-release.jks").write_bytes(base64.b64decode(d["keystore_b64"])); f=open(os.environ["GITHUB_ENV"],"a",encoding="utf-8"); f.write("ANGEL_KEYSTORE_PASSWORD="+d["store_password"]+"\\nANGEL_KEY_ALIAS="+d["key_alias"]+"\\nANGEL_KEY_PASSWORD="+d["key_password"]+"\\n"); f.close()' <<<"$SECRET_JSON"
          test -s firetv/pajaziti-release.jks

      - name: Build universal Android APK
        run: |
          gradle -p firetv assembleDebug
          cp firetv/app/build/outputs/apk/debug/app-debug.apk /tmp/pajaziti-android.apk
          gradle -p firetv clean assembleDebug -PappId=com.pajaziti.familja.fresh
          cp firetv/app/build/outputs/apk/debug/app-debug.apk /tmp/pajaziti-fresh.apk

      - name: Publish APK into website
        run: |
          git pull --rebase origin main
          cp /tmp/pajaziti-android.apk pajaziti-android.apk
          cp /tmp/pajaziti-android.apk pajaziti-firetv.apk
          cp /tmp/pajaziti-fresh.apk pajaziti-fresh.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pajaziti-android.apk pajaziti-firetv.apk pajaziti-fresh.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Android APK [skip ci]"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pajaziti-android
          path: /tmp/pajaziti-android.apk

      - name: Upload fresh APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pajaziti-fresh
          path: /tmp/pajaziti-fresh.apk
