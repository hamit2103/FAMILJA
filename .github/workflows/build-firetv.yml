name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "firetv/**"
      - ".github/workflows/build-firetv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-apk-main
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode signing keystore
        run: base64 -d firetv/pajaziti-release.jks.b64 > firetv/pajaziti-release.jks

      - name: Build universal Android APK
        run: |
          gradle -p firetv assembleDebug
          cp firetv/app/build/outputs/apk/debug/app-debug.apk /tmp/pajaziti-android.apk
          gradle -p firetv clean assembleDebug -PappId=com.pajaziti.familja.fresh
          cp firetv/app/build/outputs/apk/debug/app-debug.apk /tmp/pajaziti-fresh.apk

      - name: Publish APK into website
        run: |
          git pull --rebase origin main
          cp /tmp/pajaziti-android.apk pajaziti-android.apk
          cp /tmp/pajaziti-android.apk pajaziti-firetv.apk
          cp /tmp/pajaziti-fresh.apk pajaziti-fresh.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pajaziti-android.apk pajaziti-firetv.apk pajaziti-fresh.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Android APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pajaziti-android
          path: /tmp/pajaziti-android.apk
