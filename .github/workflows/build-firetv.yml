name: Build Fire TV APK

on:
  push:
    branches: [ main ]
    paths:
      - "firetv/**"
      - ".github/workflows/build-firetv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p firetv assembleDebug

      - name: Publish APK into website
        run: |
          cp firetv/app/build/outputs/apk/debug/app-debug.apk pajaziti-firetv.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pajaziti-firetv.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Fire TV APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pajaziti-firetv
          path: firetv/app/build/outputs/apk/debug/app-debug.apk
